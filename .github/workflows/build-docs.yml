name: Build & Deploy Docs
on:
  workflow_dispatch:  # Allow manual trigger
  push:
    branches: [ main ]
    paths:
      - "guides/**"
      - "webhooks/**"
      - "website/**"
      - "README.md"
      - ".github/workflows/build-docs.yml"
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install dependencies and build
        run: cd website && npm ci && npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: website/build

  # TODO: Add deployment step for docs.jurono.eu/api
  # This will depend on your hosting setup (CapRover, CDN, etc.)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: docs-site
          path: build
      - name: Deploy to docs.jurono.eu
        run: |
          echo "🚀 Ready to deploy to docs.jurono.eu/api"
          echo "Build artifact contains:"
          ls -la build/
          # TODO: Add actual deployment commands here
          # Example for CapRover:
          # npx caprover deploy --caproverUrl ${{ secrets.CAPROVER_URL }} --appToken ${{ secrets.DOCS_APP_TOKEN }} --appName jurono-docs --imageName jurono-docs:${GITHUB_SHA}
          #
          # Example for SCP/RSYNC:
          # rsync -avz --delete build/ user@docs.jurono.eu:/var/www/api/